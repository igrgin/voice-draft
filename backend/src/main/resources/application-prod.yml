app:
  ai:
    provider-mode: spring-ai-openai
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-transcribe}
    cleanup-model: ${OPENAI_CLEANUP_MODEL:gpt-6-luna}

spring:
  ai:
    chat:
      client:
        enabled: true
    model:
      audio:
        speech: none
        transcription: openai
      chat: openai
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY}
      audio:
        transcription:
          model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-transcribe}
